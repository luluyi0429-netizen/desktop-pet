<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>桌宠</title>
<style>
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; user-select:none; }
body { display:flex; align-items:flex-end; justify-content:center; }
#pet { display:block; height:300px; width:auto; max-width:100%; cursor:grab; touch-action:none; -webkit-user-drag:none; }
body.dragging #pet { cursor:grabbing; }
#status { position:fixed; top:2px; left:50%; transform:translateX(-50%); max-width:calc(100% - 8px); width:max-content; text-align:center; overflow-wrap:anywhere; padding:3px 7px; border-radius:6px; background:rgba(35,25,30,.8); color:white; font:11px/1.2 system-ui,sans-serif; opacity:0; pointer-events:none; }
#status.visible { opacity:1; }
#status[data-kind=tag] { background:#fff6f0; color:#9b3c59; border:1px solid #d8a6ad; border-radius:13px 13px 13px 3px; padding:5px 10px; font:600 13px/1.35 'Microsoft YaHei UI',sans-serif; box-shadow:0 2px 7px #51353a22; }
</style>
</head>
<body>
<img id="pet" alt="桌宠角色" draggable="false">
<div id="status" role="status"></div>
<script src="pet.js"></script>
</body>
</html>
