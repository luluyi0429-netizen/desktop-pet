<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>桌宠设置</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 14px 16px; background: #f5f3f1; color: #332c2e; font: 13px/1.4 'Microsoft YaHei UI', 'Segoe UI', sans-serif; user-select: none; border: 1px solid #d4cbcb; height: 100vh; }
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
label { font-weight: 600; }
output { margin-left: 7px; color: #9c4757; font-variant-numeric: tabular-nums; }
button { color: inherit; font: inherit; cursor: pointer; }
#close { border: 0; background: transparent; font-size: 19px; line-height: 20px; padding: 0 4px; }
input[type=range] { display: block; width: 100%; margin: 8px 0; accent-color: #b76375; cursor: ew-resize; }
.ticks { display: flex; justify-content: space-between; color: #817477; font-size: 11px; margin-top: 2px; }
.buttons { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #ded6d5; }
.buttons button { background: #fffdfb; border: 1px solid #d4cbcb; border-radius: 4px; padding: 5px 8px; }
.buttons button:hover { background: #f5e7e9; }
.buttons button:active { background: #eed9de; }
.walking { display: flex; align-items: center; gap: 7px; margin-top: 12px; }
.walking input { accent-color: #b76375; }
.walking label { font-weight: 400; cursor: pointer; }
.actions { display: flex; gap: 6px; margin-top: 12px; }
.actions button { font: inherit; border: 1px solid #d4cbcb; background: #fffdfb; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid #9c4757; outline-offset: 2px; }
#quit { margin-left: auto; }
body { overflow-y: auto; }
.speech { border-top:1px solid #ded6d5; margin-top:12px; padding-top:10px; }
.speech h2 { margin:0 0 9px; font-size:13px; }
.value-row { display:flex; align-items:center; justify-content:space-between; }
.hint { color:#817477; font-size:11px; margin:5px 0 0; }
.frequency { display:flex; gap:6px; margin:7px 0 12px; }
.frequency button { flex:1; border:1px solid #d4cbcb; border-radius:4px; background:#fffdfb; padding:5px 8px; }
.frequency button[aria-pressed=true] { color:white; background:#9c4757; border-color:#9c4757; }
</style>
</head>
<body>
<header><div><label for="size">桌宠大小</label><output id="percent" for="size">100%</output></div><button id="close" aria-label="关闭设置">×</button></header>
<input id="size" type="range" min="50" max="200" step="1" value="100" aria-label="桌宠大小百分比">
<div class="ticks"><span>50%</span><span>100%</span><span>150%</span><span>200%</span></div>
<div class="walking"><input id="walking" type="checkbox" checked><label for="walking">自动散步 / 攀爬</label></div>
<div class="actions"><button data-action="idle">站立</button><button data-action="sleep">睡觉</button><button data-action="climb">爬上窗口</button></div>
<p style="font-size:11px;color:#817477;margin:10px 0 0">活动间隔 18–32 秒 · 90 秒未互动入睡<br>拖到文件管理器上沿 / 内部下沿可停靠<br>5 分钟内叫醒 3 次触发老吴</p>
<div id="support" style="font-size:11px;color:#817477;margin-top:4px" aria-live="polite"></div>
<div class="walking"><input id="muted" type="checkbox"><label for="muted">静音（所有语音）</label></div>
<section class="speech" aria-labelledby="speech-title">
<h2 id="speech-title">语音设置</h2>
<div class="value-row"><label for="volume">桌宠音量</label><output id="volume-value" for="volume">100%</output></div>
<input id="volume" type="range" min="0" max="100" step="1" value="100">
<div class="value-row"><span>说话频率</span></div>
<div class="frequency" role="group" aria-label="说话频率"><button data-frequency="low" aria-pressed="false">少说</button><button data-frequency="normal" aria-pressed="false">标准</button><button data-frequency="high" aria-pressed="true">多说</button></div>
<div class="value-row"><label for="voice-cooldown">语音冷却</label><output id="cooldown-value" for="voice-cooldown">5 秒</output></div>
<input id="voice-cooldown" type="range" min="1" max="60" step="1" value="5">
<p class="hint">播放结束后开始冷却 · 拖动即保存<br>频率影响普通互动；手动老吴可立即播放。<br>静音时不发声，音量滑块保留原设置。</p>
</section>
<div class="actions"><button id="laowu">老吴</button><button id="tag-settings">标签联动…</button></div>
<div class="buttons"><button id="reset">重置</button><button id="stand">站到任务栏</button><button id="quit">退出</button></div>
<script src="settings.js"></script>
</body>
</html>
