<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>视频</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}video{display:block;width:100%;height:100%;object-fit:contain}

</style></head><body><video id="video" src="assets/video/rage.mp4" controls playsinline preload="metadata"></video><button id="close" aria-label="关闭视频（Esc）" title="关闭（Esc）">×</button><div id="status" role="status" hidden></div><script src="rage.js"></script></body></html>
